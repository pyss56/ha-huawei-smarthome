name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read manifest
        id: ver
        run: |
          MF=$(find custom_components -name manifest.json | head -n1)
          if [ -z "$MF" ]; then echo "no manifest.json found"; exit 1; fi
          VERSION=$(python3 -c "import json;print(json.load(open('$MF'))['version'])")
          DOMAIN=$(python3 -c "import json;print(json.load(open('$MF'))['domain'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION domain=$DOMAIN"

      - name: Package integration zip
        run: |
          zip -r "${{ steps.ver.outputs.domain }}.zip" "custom_components/${{ steps.ver.outputs.domain }}"

      - name: Create or update Release (with zip asset)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: ${{ steps.ver.outputs.domain }}.zip
          generate_release_notes: true
